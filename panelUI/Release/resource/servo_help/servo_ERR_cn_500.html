<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=gb2312" />
<title>无标题文档</title>
<style type="text/css">
.STYLE2 {font-size: 18px}
.警报名字体大小 {
	font-size: 18px;
	font-weight: bold;
}
.警报号字体颜色 {
	color: #900;
	font-size: 18px;
}
.产生机理字体大小 {
	font-size: 18px;
	color: #603;
}
.backcolor {
	color:rgb(0,111,55);
	word-spacing: normal;
}
</style>
</head>

<body>
<p><span class="STYLE2">警报名：</span><span class="警报号字体颜色">ER.500</span><span class="警报名字体大小"> 过速</span><br />
 <br />
<span class="产生机理字体大小">产生机理：</span><br />
<span class="backcolor">伺服电机实际转速超过过速故障阈值。<br />
</span></p>

<table width="620" border="1" align="center" cellpadding="2" cellspacing="2">
  <tr>
    <th width="100" bgcolor="#999999" scope="col">原因</th>
    <th width="210" bgcolor="#999999" scope="col">处理措施</th>
  </tr>
  <tr>
    <td>&nbsp;1.电机线缆相序错误</td>
    <td>&nbsp;按照正确U V W相序接线。</td>
  </tr>
  <tr>
    <td>&nbsp;2.200A-09h参数设置错误</td>
    <td>&nbsp;根据机械要求重新设置过速故障阈值。</td>
  </tr>
  <tr>
    <td>&nbsp;3.输入指令过大</td>
    <td>&nbsp;更改输入指令。</td>
  </tr>
  <tr>
    <td>&nbsp;4.电机速度超调</td>
    <td>&nbsp;调整增益和机械运行条件。</td>
  </tr>
  <tr>
    <td>&nbsp;5.伺服驱动器故障</td>
    <td>&nbsp;更换伺服驱动器。</td>
  </tr>
</table>
</body>
</html>
