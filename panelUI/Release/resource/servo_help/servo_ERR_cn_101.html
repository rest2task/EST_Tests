<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=gb2312" />
<title>无标题文档</title>
<style type="text/css">
.STYLE2 {font-size: 18px}
.警名字体大小 {
	font-size: 18px;
	font-weight: bold;
}
.警报号字体颜色 {
	color: #900;
	font-size: 18px;
}
.产生机理字体大小 {
	font-size: 18px;
	color: #603;
}
.backcolor {
	color:rgb(0,111,55);
	word-spacing: normal;
}
</style>
</head>

<body>
<p><span class="STYLE2">警报名：</span><span class="警报号字体颜色">ER.101</span><span class="警报名字体大小"> 伺服内部参数出现异常</span><br />
  <br />
</p>

<table width="620" border="1" align="center" cellpadding="2" cellspacing="2">
  <tr>
    <th width="40" bgcolor="#999999" scope="col">序号</th>
    <th width="180" bgcolor="#999999" scope="col">故障原因</th>
    <th width="360" bgcolor="#999999" scope="col">故障处理对策</th>
  </tr>
  <tr>
    <td  align="center">&nbsp;1</td>
    <td>&nbsp;控制电源电压瞬时下降</td>
    <td>&nbsp;更换电源。随后将系统参数恢复初始化 (2002- 20h=1) ，重新写入参数。</td>
  </tr>
  <tr>
    <td  align="center">&nbsp;2</td>
    <td>&nbsp;参数存储过程中瞬间掉电</td>
    <td>&nbsp;重新上电，系统参数恢复初始化后，重新写入参数。</td>
  </tr>
  <tr>
    <td  align="center">&nbsp;3</td>
    <td>&nbsp;一定时间内参数的写入次数超过了最大值</td>
    <td>&nbsp;改变参数写入方法，并重新写入。</td>
  </tr>
  <tr>
    <td  align="center">&nbsp;4</td>
    <td>&nbsp;更新了软件</td>
    <td>&nbsp;重新设置驱动器型号和电机型号，系统参数恢复初始化。</td>
  </tr>
  <tr>
    <td  align="center">&nbsp;5</td>
    <td>&nbsp;伺服驱动器故障</td>
    <td>&nbsp;更换伺服驱动器。</td>
  </tr>
  <tr>
    <td  align="center">&nbsp;6</td>
    <td>&nbsp;-</td>
    <td>&nbsp;H0B-43 和 H0B-44 可定位异常参数的功能码号。</td>
  </tr>

</table>
<p>&nbsp;</p>
</body>
</html>
