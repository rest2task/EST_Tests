<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=gb2312" />
<title>无标题文档</title>
<style type="text/css">
.STYLE2 {font-size: 18px}
.警报名字体大小 {
	font-size: 18px;
	font-weight: bold;
}
.警报号字体颜色 {
	color: #900;
	font-size: 18px;
}
.产生机理字体大小 {
	font-size: 18px;
	color: #603;
}
.backcolor {
	color:rgb(0,111,55);
	word-spacing: normal;
}
</style>
</head>

<body>
<p><span class="STYLE2">警报名：</span><span class="警报号字体颜色">ER.731</span><span class="警报名字体大小"> 编码器电池失效</span><br />
 <br />
<span class="产生机理字体大小">产生机理：</span><br />
<span class="backcolor">绝对值编码器的编码器电池电压低于3.0V<br />
</span></p>

<table width="620" border="1" align="center" cellpadding="2" cellspacing="2">
  <tr>
    <th width="100" bgcolor="#999999" scope="col">原因</th>
    <th width="230" bgcolor="#999999" scope="col">确认方法</th>
    <th width="210" bgcolor="#999999" scope="col">处理措施</th>
  </tr>
  <tr>
    <td>&nbsp;1.断电期间，未接电池。</td>
    <td>
    <p> &nbsp;确认断电期间是否连接。</p></td>
    <td>
    <p >&nbsp;设置200D-15h=1清除故障。</p></td>
  </tr>
  <tr>
    <td>&nbsp;2.编码器电池电压过低。</td>
    <td>&nbsp;测量电池电压。</td>
    <td>&nbsp;更换新的电压匹配的电池。</td>
  </tr>
</table>
</body>
</html>
