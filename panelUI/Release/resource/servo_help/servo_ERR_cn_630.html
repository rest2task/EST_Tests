<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=gb2312" />
<title>无标题文档</title>
<style type="text/css">
.STYLE2 {font-size: 18px}
.警报名字体大小 {
	font-size: 18px;
	font-weight: bold;
}
.警报号字体颜色 {
	color: #900;
	font-size: 18px;
}
.产生机理字体大小 {
	font-size: 18px;
	color: #603;
}
.backcolor {
	color:rgb(0,111,55);
	word-spacing: normal;
}
</style>
</head>

<body>
<p><span class="STYLE2">警报名：</span><span class="警报号字体颜色">ER.630</span><span class="警报名字体大小"> 堵转电机过热保护</span><br />
 <br />
<span class="产生机理字体大小">产生机理：</span><br />
<span class="backcolor">电机实际转速低于10rpm，但转矩指令达到限定值，且持续时间达到200A-21h设定值。<br />
</span></p>

<table width="620" border="1" align="center" cellpadding="2" cellspacing="2">
  <tr>
    <th width="100" bgcolor="#999999" scope="col">原因</th>
    <th width="210" bgcolor="#999999" scope="col">处理措施</th>
  </tr>
  <tr>
    <td>&nbsp;1.驱动器 U V W 输出接线问题</td>
    <td>&nbsp;按照正确配线重新接线，或更换线缆。</td>
  </tr>
  <tr>
    <td>&nbsp;2.机械因素使电机堵转</td>
    <td>&nbsp;排除机械因素。</td>
  </tr>
  <tr>
    <td>&nbsp;3.-</td>
    <td>&nbsp;联系厂家；H0A-33 设 0 可以屏蔽该故障。</td>
  </tr>
</table>
</body>
</html>
