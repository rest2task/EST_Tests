<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=gb2312" />
<title>无标题文档</title>
<style type="text/css">
.STYLE2 {font-size: 18px}
.警报名字体大小 {
	font-size: 18px;
	font-weight: bold;
}
.警报号字体颜色 {
	color: #900;
	font-size: 18px;
}
.产生机理字体大小 {
	font-size: 18px;
	color: #603;
}
.backcolor {
	color:rgb(0,111,55);
	word-spacing: normal;
}
</style>
</head>

<body>
<p><span class="STYLE2">警报名：</span><span class="警报号字体颜色">ER.B00</span><span class="警报名字体大小"> 位置偏差过大</span><br />
 <br />
<span class="产生机理字体大小">产生机理：</span><br />
<span class="backcolor">位置控制模式下，位置偏差大于6065h设定值。<br />
</span></p>

<table width="620" border="1" align="center" cellpadding="2" cellspacing="2">
  <tr>
    <th width="100" bgcolor="#999999" scope="col">原因</th>
    <th width="210" bgcolor="#999999" scope="col">处理措施</th>
  </tr>
  <tr>
    <td>&nbsp;1.驱动器输出问题</td>
    <td>&nbsp;检查动力线线缆，并重新接线。</td>
  </tr>
  <tr>
    <td>&nbsp;2.机械因素使电机堵转</td>
    <td>&nbsp;排查机械因素。</td>
  </tr>
  <tr>
    <td>&nbsp;3.伺服驱动器增益较低</td>
    <td>&nbsp;调整驱动器增益。</td>
  </tr>
  <tr>
    <td>&nbsp;4.位置指令增量过大</td>
    <td>&nbsp;减小位置指令或齿轮比。</td>
  </tr>
  <tr>
    <td>&nbsp;5.故障值 6065h 过小</td>
    <td>&nbsp;增大 6065h 设定值。</td>
  </tr>
  <tr>
    <td>&nbsp;6.伺服驱动器 / 电机故障</td>
    <td>&nbsp;更换伺服驱动器 / 电机。</td>
  </tr>
</table>
</body>
</html>
