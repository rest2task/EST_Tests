<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=gb2312" />
<title>无标题文档</title>
<style type="text/css">
.STYLE2 {font-size: 18px}
.警报名字体大小 {
	font-size: 18px;
	font-weight: bold;
}
.警报号字体颜色 {
	color: #900;
	font-size: 18px;
}
.产生机理字体大小 {
	font-size: 18px;
	color: #603;
}
.backcolor {
	color:rgb(0,111,55);
	word-spacing: normal;
}
</style>
</head>

<body>
<p><span class="STYLE2">警报名：</span><span class="警报号字体颜色">ER.B01</span><span class="警报名字体大小">位置指令过大</span><br />
  <br />
</p>

<table width="620" border="1" align="center" cellpadding="2" cellspacing="2">
 <tr>
    <th width="40" bgcolor="#999999" scope="col">序号</th>
    <th width="180" bgcolor="#999999" scope="col">故障原因</th>
    <th width="360" bgcolor="#999999" scope="col">故障处理对策</th>
  </tr>
  <tr>
    <td  align="center">&nbsp;1</td>
    <td>&nbsp;位置指令增量过大</td>
    <td>&nbsp;减小目标位置指令增量</td>
  </tr>
  <tr>
    <td  align="center">&nbsp;2</td>
    <td>&nbsp;目标位置设置问题</td>
    <td>&nbsp;模式切换前或伺服使能时，将当前位置的数值赋给目标位置(607A目标位置)</td>
  </tr>
<tr>
    <td  align="center">&nbsp;3</td>
    <td>&nbsp;同步周期相位交越，导致位置指令积累过大</td>
    <td>&nbsp;如果用 AM600 同步偏移参数设置成 0； 对其他上位机,请检查上位机通讯</td>
  </tr>
<tr>
    <td  align="center">&nbsp;4</td>
    <td>&nbsp;电机速度限制错误</td>
    <td>&nbsp;更改电机最大速度</td>
  </tr>

</table>
<p>&nbsp;</p>
</body>
</html>
