<title>无标题文档</title>
<style type="text/css">
.STYLE2 {font-size: 18px}
.警报名字体大小 {
	font-size: 18px;
	font-weight: bold;
}
.警报号字体颜色 {
	color: #900;
	font-size: 18px;
}
.产生机理字体大小 {
	font-size: 18px;
	color: #603;
}
.backcolor {
	color:rgb(0,111,55);
	word-spacing: normal;
}
</style>
</head>

<body>
<p><span class="STYLE2">警报名：</span><span class="警报号字体颜色">ER.108</span><span class="警报名字体大小"> 参数存储故障</span><br />
 <br />
<span class="产生机理字体大小">产生机理：</span><br />
  <span class="backcolor">无法向EEPROM中写入参数值；<br />无法从EEPROM中读取参数值。</span></p>

<table width="620" border="1" align="center" cellpadding="2" cellspacing="2">
  <tr>
    <th width="100" bgcolor="#999999" scope="col">原因</th>
    <th width="230" bgcolor="#999999" scope="col">确认方法</th>
    <th width="210" bgcolor="#999999" scope="col">处理措施</th>
  </tr>
  <tr>
    <td>&nbsp;1.参数写入出现异常</td>
    <td rowspan="2">
    <p> &nbsp;更改某参数后，再次上电，查看该参数值是否保存。</p></td>
    <td rowspan="2">
    <p >&nbsp;更改速度指令键盘设定值 (2006-03h = 1) 后重新上电，若问题仍存在，更换伺服驱动器。</p></td>
  </tr>
  <tr>
    <td>&nbsp;2.参数读取出现异常</td>
  </tr>
</table>
<p>&nbsp;</p>
</body>
