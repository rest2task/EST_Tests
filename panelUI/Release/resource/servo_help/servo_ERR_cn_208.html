<title>无标题文档</title>

.STYLE2 {font-size: 18px}
.警报名字体大小 {
	font-size: 18px;
	font-weight: bold;
}
.警报号字体颜色 {
	color: #900;
	font-size: 18px;
}
.产生机理字体大小 {
	font-size: 18px;
	color: #603;
}
.backcolor {
	color:rgb(0,111,55);
	word-spacing: normal;
}
</style>

<body>
<p><span class="STYLE2">警报名：</span><span class="警报号字体颜色">ER.208</span><span class="警报名字体大小"> FPGA系统采样运算超时</span><br />
 <br />
<span class="产生机理字体大小">产生机理：</span><br />
<span class="backcolor">本故障含多个内容部故障码。<br />
</span></p>

<table width="620" border="1" align="center" cellpadding="2" cellspacing="2">
  <tr>
    <th width="100" bgcolor="#999999" scope="col">原因</th>
    <th width="210" bgcolor="#999999" scope="col">处理措施</th>
  </tr>
  <tr>
    <td>&nbsp;1.MCU 或编码器通信超时</td>
    <td>&nbsp;检查编码器线缆，且和动力线分开走线。
      更换伺服电机或伺服驱动器。</td>
  </tr>
  <tr>
    <td>&nbsp;2.电流采样超时</td>
    <td>&nbsp;1. 现场走线尽量强弱电分开勿捆扎。
      2. 更换伺服驱动器。</td>
  </tr>
  <tr>
    <td>&nbsp;3.高精度 AD 转换超时</td>
    <td>&nbsp;采用双绞屏蔽线重新接线，缩短线路长度。</td>
  </tr>

   
 
</table>
</body>
