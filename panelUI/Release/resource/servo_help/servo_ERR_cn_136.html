<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=gb2312" />
<title>无标题文档</title>
<style type="text/css">
.STYLE2 {font-size: 18px}
.警报名字体大小 {
	font-size: 18px;
	font-weight: bold;
}
.警报号字体颜色 {
	color: #900;
	font-size: 18px;
}
.产生机理字体大小 {
	font-size: 18px;
	color: #603;
}
.backcolor {
	color:rgb(0,111,55);
	word-spacing: normal;
}
</style>
</head>

<body>
<p><span class="STYLE2">警报名：</span><span class="警报号字体颜色">ER.136</span><span class="警报名字体大小"> 电机编码器ROM中数据校验错误或未存入参数</span><br />
 <br />
<span class="产生机理字体大小">产生机理：</span><br />
<span class="backcolor">驱动器读取编码器ROM区参数时，发现未存入参数，或参数与约定值不一致。<br />
</span></p>

<table width="620" border="1" align="center" cellpadding="2" cellspacing="2">
  <tr>
    <th width="100" bgcolor="#999999" scope="col">原因</th>
    <th width="210" bgcolor="#999999" scope="col">处理措施</th>
  </tr>
  <tr>
    <td>&nbsp;1.驱动器和电机不匹配</td>
    <td>&nbsp;更换为相互匹配的驱动器及电机。</td>
  </tr>
  <tr>
    <td>&nbsp;2.A3 系列高性能编码器 ROM 中参数校验错误或未存放参数</td>
    <td>&nbsp;检查编码器线缆连接。
      编码器线缆与动力线分开走线。</td>
  </tr>
  <tr>
    <td>&nbsp;3.驱动器故障</td>
    <td>&nbsp;更换伺服驱动器。</td>
  </tr>
</table>
</body>
</html>
