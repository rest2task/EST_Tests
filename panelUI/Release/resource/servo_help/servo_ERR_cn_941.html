<head>
<meta http-equiv="Content-Type" content="text/html; charset=gb2312" />
<title>无标题文档</title>
<style type="text/css">
.STYLE2 {font-size: 18px}
.警报名字体大小 {
	font-size: 18px;
	font-weight: bold;
}
.警报号字体颜色 {
	color: #900;
	font-size: 18px;
}
.产生机理字体大小 {
	font-size: 18px;
	color: #603;
}
.backcolor {
	color:rgb(0,111,55);
	word-spacing: normal;
}
</style>
</head>

<body>
<p><span class="STYLE2">警报名：</span><span class="警报号字体颜色">ER.941</span><span class="警报名字体大小"> 变更参数需重新上电生效</span><br />
 <br />
<span class="产生机理字体大小">产生机理：</span><br />
<span class="backcolor">伺服驱动器的功能码属性“生效时间”为“再次通电”时，该功能码参数值变更后，驱动器提醒用户需要重新上电。<br />
</span></p>

<table width="620" border="1" align="center" cellpadding="2" cellspacing="2">
  <tr>
    <th width="100" bgcolor="#999999" scope="col">原因</th>
    <th width="210" bgcolor="#999999" scope="col">处理措施</th>
  </tr>
  <tr>
    <td>&nbsp;1.变更了再次通电后更改生效的功能码。</td>
    <td>&nbsp;重新上电。</td>
  </tr>
  
</table>
</body>
</html>
