<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=gb2312" />
<title>无标题文档</title>
<style type="text/css">
.STYLE2 {font-size: 18px}
.警报名字体大小 {
	font-size: 18px;
	font-weight: bold;
}
.警报号字体颜色 {
	color: #900;
	font-size: 18px;
}
.产生机理字体大小 {
	font-size: 18px;
	color: #603;
}
.backcolor {
	color:rgb(0,111,55);
	word-spacing: normal;
}
</style>
</head>

<body>
<p><span class="STYLE2">警报名：</span><span class="警报号字体颜色">ER.234</span><span class="警报名字体大小">飞车</span><br />
 <br />
<span class="产生机理字体大小">产生机理：</span><br />
<span class="backcolor">转矩控制模式下，转矩指令方向与速度反馈方向相反；<br />位置或速度控制模式下，速度反馈与速度指令方向相反。
</span></p>

<table width="620" border="1" align="center" cellpadding="2" cellspacing="2">
  <tr>
    <th width="100" bgcolor="#999999" scope="col">原因</th>
    <th width="210" bgcolor="#999999" scope="col">处理措施</th>
  </tr>
  <tr>
    <td>&nbsp;1.U V W相序接线错误</td>
    <td>&nbsp;按照正确U V W相序接线。</td>
  </tr>
  <tr>
    <td>&nbsp;2.初始相位错误</td>
    <td>&nbsp;重新上电。</td>
  </tr>
  <tr>
    <td>&nbsp;3.编码器问题</td>
    <td>&nbsp;检查驱动器和电机是否匹配，并检查接线。</td>
  </tr>
  <tr>
    <td>&nbsp;4.垂直轴工况下，重力负载过大</td>
    <td>&nbsp;减小垂直轴负载，或提高刚性。</td>
  </tr>
  <tr>
    <td>&nbsp;5.其他原因导致的速度失控</td>
    <td>&nbsp;联系厂家；H0A-12 设 0 可以屏蔽该故障。</td>
  </tr>
</table>
</body>
</html>
