<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=gb2312" />
<title>无标题文档</title>
<style type="text/css">
.STYLE2 {font-size: 18px}
.警报名字体大小 {
	font-size: 18px;
	font-weight: bold;
}
.警报号字体颜色 {
	color: #900;
	font-size: 18px;
}
.产生机理字体大小 {
	font-size: 18px;
	color: #603;
}
.backcolor {
	color:rgb(0,111,55);
	word-spacing: normal;
}
</style>
</head>

<body>
<p><span class="STYLE2">警报名：</span><span class="警报号字体颜色">ER.620</span><span class="警报名字体大小"> 电机过载</span><br />
 <br />
<span class="产生机理字体大小">产生机理：</span><br />
<span class="backcolor">电机累积热量过高，且达到故障阈值。<br />
</span></p>

<table width="620" border="1" align="center" cellpadding="2" cellspacing="2">
  <tr>
    <th width="100" bgcolor="#999999" scope="col">原因</th>
    <th width="210" bgcolor="#999999" scope="col">处理措施</th>
  </tr>
  <tr>
    <td>&nbsp;1.电机、编码器接线问题</td>
    <td>&nbsp;正确连接线缆。</td>
  </tr>
  <tr>
    <td>&nbsp;2.负载过大</td>
    <td>&nbsp;更换伺服驱动器或减轻负载。</td>
  </tr>
  <tr>
    <td>&nbsp;3.加减速太频繁或者负载惯量很大</td>
    <td>&nbsp;增大单次运行中的加减速时间。</td>
  </tr>
  <tr>
    <td>&nbsp;4.增益和刚性设置问题</td>
    <td>&nbsp;重新调整增益。</td>
  </tr>
  <tr>
    <td>&nbsp;5.驱动器或者电机型号设置错误</td>
    <td>&nbsp;正确设置的驱动器型号 (2001-03h) 和总线电机型号（2000-06h）。</td>
  </tr>
  <tr>
    <td>&nbsp;6.机械因素使电机堵转</td>
    <td>&nbsp;排除机械因素。</td>
  </tr>
  <tr>
    <td>&nbsp;7.伺服驱动器故障</td>
    <td>&nbsp;更换伺服驱动器。</td>
  </tr>
  <tr>
    <td>&nbsp;8.-</td>
    <td>&nbsp;联系厂家；H0A-26 设 0 可以屏蔽该故障。</td>
  </tr>
</table>
</body>
</html>
