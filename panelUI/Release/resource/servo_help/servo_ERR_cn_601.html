<title>无标题文档</title>

.STYLE2 {font-size: 18px}
.警报名字体大小 {
	font-size: 18px;
	font-weight: bold;
}
.警报号字体颜色 {
	color: #900;
	font-size: 18px;
}
.产生机理字体大小 {
	font-size: 18px;

}

	color:rgb(0,111,55);
	word-spacing: normal;

<body>
<p><span class="STYLE2">警报名：</span><span class="警报号字体颜色">ER.601(警告)</span><span class="警报名字体大小">回原点超时故障</span><br />
  <br />
</p>

<table width="620" border="1" align="center" cellpadding="2" cellspacing="2">
 <tr>
    <th width="40" bgcolor="#999999" scope="col">序号</th>
    <th width="180" bgcolor="#999999" scope="col">故障原因</th>
    <th width="360" bgcolor="#999999" scope="col">故障处理对策</th>
  </tr>
  <tr>
    <td  align="center">&nbsp;1</td>
    <td>&nbsp;原点开关故障</td>
    <td>&nbsp;检查 DI 接线，确定原点回归操作是否正确。</td>
  </tr>
  <tr>
    <td  align="center">&nbsp;2</td>
    <td>&nbsp;查找原点时间过短</td>
    <td>&nbsp;增大 2005-24h。</td>
  </tr>
 <tr>
    <td  align="center">&nbsp;3</td>
    <td>&nbsp;原点搜索速度过小</td>
    <td>&nbsp;增大 6099-01h。</td>
  </tr>
<tr>
    <td  align="center">&nbsp;4</td>
    <td>&nbsp;开关设置不合理</td>
    <td>&nbsp;合理设置硬件开关位置。</td>
  </tr>

</table>
<p>&nbsp;</p>
