<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=gb2312" />
<title>无标题文档</title>
<style type="text/css">
.STYLE2 {font-size: 18px}
.警报名字体大小 {
	font-size: 18px;
	font-weight: bold;
}
.警报号字体颜色 {
	color: #900;
	font-size: 18px;
}
.产生机理字体大小 {
	font-size: 18px;
	color: #603;
}
.backcolor {
	color:rgb(0,111,55);
	word-spacing: normal;
}
</style>
</head>

<body>
<p><span class="STYLE2">警报名：</span><span class="警报号字体颜色">ER.650</span><span class="警报名字体大小"> 散热器过热</span><br />
 <br />
<span class="产生机理字体大小">产生机理：</span><br />
<span class="backcolor">驱动器功率模块温度高于过温保护点。<br />
</span></p>

<table width="620" border="1" align="center" cellpadding="2" cellspacing="2">
  <tr>
    <th width="100" bgcolor="#999999" scope="col">原因</th>
    <th width="210" bgcolor="#999999" scope="col">处理措施</th>
  </tr>
  <tr>
    <td>&nbsp;1.环境温度过高</td>
    <td>&nbsp;改善伺服驱动器的冷却条件。</td>
  </tr>
  <tr>
    <td>&nbsp;2.过载后，通过关闭电源复位故障，并反复多次</td>
    <td>&nbsp;变更故障复位方法，过载后等待30s再复位。</td>
  </tr>
  <tr>
    <td>&nbsp;3.风扇坏</td>
    <td>&nbsp;更换风扇。</td>
  </tr>
  <tr>
    <td>&nbsp;4.伺服驱动器安装问题</td>
    <td>&nbsp;根据驱动器安装标准进行安装。</td>
  </tr>
  <tr>
    <td>&nbsp;5.伺服驱动器故障</td>
    <td>&nbsp;更换伺服驱动器。</td>
  </tr>
</table>
</body>
</html>
