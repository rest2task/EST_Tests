<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=gb2312" />
<title>无标题文档</title>
<style type="text/css">
.STYLE2 {font-size: 18px}
.警报名字体大小 {
	font-size: 18px;
	font-weight: bold;
}
.警报号字体颜色 {
	color: #900;
	font-size: 18px;
}
.产生机理字体大小 {
	font-size: 18px;
	color: #603;
}
.backcolor {
	color:rgb(0,111,55);
	word-spacing: normal;
}
</style>
</head>

<body>
<p><span class="STYLE2">警报名：</span><span class="警报号字体颜色">ER.740</span><span class="警报名字体大小"> 编码器干扰</span><br />
 <br />
<span class="产生机理字体大小">产生机理：</span><br />
<span class="backcolor">编码器Z信号被干扰，导致Z信号对应的电角度变化过大。<br />
</span></p>

<table width="620" border="1" align="center" cellpadding="2" cellspacing="2">
  <tr>
    <th width="100" bgcolor="#999999" scope="col">原因</th>
    <th width="210" bgcolor="#999999" scope="col">处理措施</th>
  </tr>
  <tr>
    <td>&nbsp;1.编码器接线错误</td>
    <td>&nbsp;检查编码器线缆，并重新接线。</td>
  </tr>
  <tr>
    <td>&nbsp;2.编码器 Z 信号受干扰</td>
    <td>&nbsp;检查接线，并保证编码器线缆与动力线分开走线。</td>
  </tr>
  <tr>
    <td>&nbsp;3.编码器故障</td>
    <td>&nbsp;更换编码器线缆和伺服电机。</td>
  </tr>
</table>
</body>
</html>
