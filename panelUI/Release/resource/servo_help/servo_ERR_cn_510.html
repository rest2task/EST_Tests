<head>
<meta http-equiv="Content-Type" content="text/html; charset=gb2312" />
<title>无标题文档</title>
<style type="text/css">
.STYLE2 {font-size: 18px}
.警报名字体大小 {
	font-size: 18px;
	font-weight: bold;
}
.警报号字体颜色 {
	color: #900;
	font-size: 18px;
}
.产生机理字体大小 {
	font-size: 18px;
	color: #603;
}
.backcolor {
	color:rgb(0,111,55);
	word-spacing: normal;
}
</style>
</head>

<body>
<p><span class="STYLE2">警报名：</span><span class="警报号字体颜色">ER.510</span><span class="警报名字体大小">脉冲输出过速</span><br />
  <br />
</p>

<table width="620" border="1" align="center" cellpadding="2" cellspacing="2">
 <tr>
    <th width="40" bgcolor="#999999" scope="col">序号</th>
    <th width="180" bgcolor="#999999" scope="col">故障原因</th>
    <th width="360" bgcolor="#999999" scope="col">故障处理对策</th>
  </tr>
  <tr>
    <td  align="center">&nbsp;1</td>
    <td>&nbsp;输出脉冲频率超过了硬件允许的频率上限(1MHz)</td>
    <td>&nbsp;减小 2005-12h( 编码器分频脉冲数 )。减小输入脉冲频率至硬件允许的频率上限以内。</td>
  </tr>

</table>
<p>&nbsp;</p>
</body>
</html>
