    <h2 class="警报标题">警报名称：马达启停异常(4100105)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">1、马达启动后，输入点“马达启动”无信号或输入点“马达异常”有信号<br />2、马达关闭后，输入点“马达启动”有信号或输入点“马达异常”无信号</p>
<br />
