    <h2 class="警报标题">警报名称：料位过低(1010010D)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">仅在选择BMC机功能时出现，储料过程中检测到“下压缸料位低”或“下压缸进终”。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.查看下压缸是否进终，料位是否低于下限。<br />2.查看面板IO界面“下压缸料位低”、“下压缸进终”输入点是否正常，相应检测开关是否损坏。<br />查看方法提示：如下图将原接线路脱开，用一根导线将对应的输入点端口与HCOM相连，再断开，查看对应编号指示是否变化。</p>
<br />
