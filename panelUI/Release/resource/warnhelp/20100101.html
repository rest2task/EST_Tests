    <h2 class="警报标题">警报名称：关模未到定位(20100101)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">1.关模过程，关模时间超过关模计时警报上限；<br />2.使用美规标准，座进前判断关模是否到底。<br />3.开启了特殊功能，在射出前检查关模是否到底。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.查看面板IO界面“关模终”输入是否正常，关模终行程开关是否损坏。<br />查看方法提示：如下图将原接线路脱开，用一根导线将对应的输入点端口与HCOM相连，再断开，查看对应编号指示是否变化。</p>
