<body>
<p>窗口名：射出曲线</p>
<p>射出功能一画面, 射出曲线模式 选择时间进入此画面。</p>
<p>曲线选择处可以选择：当前曲线和历史曲线。</p>
<p>当前曲线显示的是实时的曲线状态；</p>
<p>历史曲线最多显示最近10次射出曲线。</p>
</body>
