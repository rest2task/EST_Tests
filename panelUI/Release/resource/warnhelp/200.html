<body>
<p>窗口名：电子尺调整</p>
<p>1.归零设定：射出、开关模、托模及压力传感器在零位时（射出到底、关模到底、托模退到底、系统压力为0），而当前位置显示不为零，则在归零设置选择确定进行归零。</p>
<p><br />
  2.调整位置：螺杆、模具及顶针在最大位置时（开模到底.射退到底.顶针进到底），用圈尺测量机构到零点的距离，将测量值输入对应的‘调整位置’框，当前位置变为测量值时，完成调整。</p>
<p><br />
  3.把每个动作在最大位置测量到的数值，即最大机械行程，减去2～5mm后输入到机器配置页面的机械行程栏内。此步骤是限制了动作终止位置输入上限，以防止机械撞击。 </p>
</body>
