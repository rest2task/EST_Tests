    <h2 class="警报标题">警报名称：液压安全或电眼保护异常(2010010D)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">关模时，液压安全检知有信号。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.检查液压安全检知输入点，是否安全。<br />2.查看I/O界面“液压安全检知”输入是否正常，液压安全检知行程开关是否损坏。</p>
