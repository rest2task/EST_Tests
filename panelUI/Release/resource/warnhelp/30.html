<body>
<p>窗口名：射出</p>
<p>1.射出段数可在“功能”中选择；</p>
<p><br />
  2.终止位置：设定值受相邻段位置限制，需按以下顺序设定：从射出一段依次往下设定；</p>
<p><br />
3.注射时间：此设定值需依据“保压转换方式”设定；CODE1加上8，射出时间可精确到0.001S。</p>
</body>
