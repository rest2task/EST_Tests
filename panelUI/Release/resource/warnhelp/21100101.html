    <h2 class="警报标题">警报名称：托模未到定位(21100101)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">托模未退到有效位置。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.进入托模参数页面，合理设置“托模退位置有效区”和“托模终止位置”。<br />2.查看面板IO界面“托退终”输入是否正常，托退终接近开关是否损坏。<br />3.若使用顶针保护功能，请查看面板I/O界面“顶针保护”输入是否正常，顶针保护开关是否损坏。</p>
<br />

</body>
