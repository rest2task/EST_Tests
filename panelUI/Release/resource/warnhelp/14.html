<body>
<p>窗口名：开模参数</p>
<p>1.压力、流量斜率：加减速时间，单位为秒(S)；适当设置斜率，可使机器动作连贯柔和，但机器响应会有所变慢。</p>
<p><br />
  2.开模一段是一慢，开模终是二慢，中间3段为快；</p>
<p><br />
  3.开模慢速调试压力：粗调模状态下做开模动作输出的压力、流量。</p>
<p><br />
  4.开模慢速阀动作时间:特殊机使用，慢速阀用时间控制。 </p>
</body>
