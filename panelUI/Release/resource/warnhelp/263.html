<body>
<p>窗口名：安装设置</p>
<p>1.工作参数导入/导出：可把当前的主机、面板、模具参数导出到U盘，或者从U盘导入以上数据。当模具换到另一台注塑机或更换面板时使用。</p>
<p>1.1 主机数据包括：机器调整DA、电子尺AD、机器配置画面的code、IO重定义等；</p>
<p>1.2 面板数据包括：当前的模具资料和机器资料，推力座对应表等；</p>
<p>1.3 模具数据包括：模具画面显示的已保存的所有模具资料；</p>
<!--<p><br />
   2.该页面备份的是：面板基本设置，机器参数，当前模具参数，泵浦配置参数，DA比例阀线性参数。 </p>-->
<p><br />
   2.恢复为出厂值/默认值：可把当前的主机、面板恢复为出厂值/默认值，其中恢复为出厂值，需要机器已进行出厂数据保存操作。</p>
