<body style="width:650px;">
    <h2 class="警报标题">警报名称：气压过低(2010010B)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">关模或者开模时，输入点气压检知有信号。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.使得气压正常。<br />2.查看I/O界面“气压检知”输入是否正常，气压检知行程开关是否损坏。<br />3.根据需要，是否使用该点，不需要可以去除。</p>
<br />
