<p>窗口名：面板测试</p>
<p>1.此功能用于面板按键和显示灯测试；当按下面板键后，画面上对应的显示颜色将发生变化，若面板上有显示灯，则该显示灯状态也发生变化；连续按“主画面”键三次可退出本画面。 </p>
