    <h2 class="警报标题">警报名称：开模保护失败(20100105)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">在使用机械手时，开模动作的时间异常：<br />1、开模时间小于0.5s<br />2、全自动时此次开模时间与上一模开模时间比，偏差较大。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1、首先确定开模是否稳定，是否存在一模拖动一模未拖动的情况。此类情况调整开模参数使其适当过冲。<br />2、检查电子尺接线（10V\信号线\GND）主机与电子尺两端接线，如有必要可以重新接一次。<br />3、机器年限较长，电子尺磨损严重，需要更换电子尺。</p>
<br />
