<body>
<p>窗口名：中子参数</p>
<p>1.多组中子的参数每次只能选择其中一组进行设置。修改参数只对被勾选的一组中子有效。 </p>
<p><br />
  2.压力、流量斜率：加减速时间，单位为秒(S)；适当设置斜率，可使机器动作连贯柔和，但机器响应会有所变慢；</p>
<p><br />
  3.中子慢速调试压力、流量：调模状态下做中子动作输出的压力、流量。 </p>
</body>
