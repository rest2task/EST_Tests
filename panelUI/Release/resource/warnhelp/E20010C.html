<title>TC2 料筒温度过高，请降温</title>

<style type="text/css">
.警报标题 {
 color: #900;
 font-size: 18px;
    font-weight: bold;
}
.标题 {
    font-size: 18px;

 color:rgb(0,111,55);
 word-spacing: normal;

<body style="width:650px;">
    <h2 class="警报标题">警报名称：TC2 料筒温度过高，请降温(E20010C)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">温度优化时，所有优化的温度段的温度必须小于60度。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">等待所有温度实际值低于60度后在再进行温度优化。</p>
<br />

</body>
