<body>
<p>窗口名：温度</p>
<p>1.加温状态说明：</p>
<p>1.1 灰色：电热关；</p>
<p>1.2 蓝色：电热已开启，但此段温度关；</p>
<p>1.3 橙色：电热开启且实际温度在PID控制区之外；</p>
<p>1.4 黄色：电热开启且实际温度在PID控制区之内；</p>
<p>1.5 红色：温度故障异常；</p>
<p><br />
  2.温度显示说明：</p>
<p>2.1 显示999或777，感温线断开或接反。</p>
<p>2.2 设定值不能输入表示该段未使用。</p>
<p><br />
  3.首段温度使用百分比加热方式，必须将首段温控缓冲区设为0。</p>
<p><br />
  4.预温计时：当每一段实际温度到达有效温度时开始计时，计时结束后才允许作射出.储料.清料.射退动作；有效温度=设定温度-5℃。</p>
</body>
