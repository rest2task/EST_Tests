    <h2 class="警报标题">警报名称：未到设定压力，检测油路(9100109)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">伺服比例阀自整定过程，压力在5S内未达到设定值。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.若DA值出现多个4000，需要检查油路是否有泄漏；<br />2.查看比例阀是否调整合适；<br />调整方法：机器组装完毕，使用内六角扳手顺时针旋转比例阀尾部锁紧螺丝，强制关闭比例阀；然后对机器进行试压操作，至压力正常后，再逆时针旋转比例阀尾部螺丝，使与尾盖平齐。<br />3.查看系统溢流阀是否拧紧。</p>
<br />
