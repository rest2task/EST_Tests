<body>
<p>窗口名：输出点一</p>
<p>1.输出点的功能和状态：</p>
<p> 1.1 每一个输出点编号的右边表示该点功能，左边的圆圈表示该点输出状态，变绿灯时为输出有效。</p>
<p><br />
  1.2 若某个点输出硬件损坏，可通过 “IO重定义”可用一个空余的点将坏的点替换掉（注意下位机相应接线的调整）。</p>
<p><br />
  2.A620主机配置24个输出点，A920主机配置32出输入点。</p>
<p><br />
  3.在手动的状态中按下输入键，光标下的点会强制输出。</p>
<p>&nbsp; </p>
</body>
