    <h2 class="警报标题">警报名称：润滑2 压力开关故障(30200103)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">润滑模式2或者3时，即非单时间时，并且配备有输入点"润滑检知"，在润滑时检测到"润滑检知"的信号输入时长超过"润滑检知检测时间"时，发警报回手动和切电机。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.确认实际润滑检知有信号；<br />2.查看I/O界面“润滑检知”输入是否正常，润滑检知行程开关是否损坏。</p>
<br />
