<body>
<p>窗口名：射出参数</p>
<p>1.射出调试：调模状态做射出动作时以此处设定的压力、流量输出；</p>
<p><br />
  2.射出启动压力、速度斜率：射出一段压力、流量上升的时间；</p>
<p><br />
  3.射出转换压力、流量斜率：射出过程中各动作段切换时压力、流量上升的时间；</p>
<p><br />
  4.射出任务前延时：延迟该设定的时间后做射出动作。 </p>
</body>
