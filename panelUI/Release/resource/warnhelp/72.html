<body>
<p>窗口名：其它参数一</p>
<p>一、座台：<br />
1. 斜率：加减速时间，单位为秒(S)；适当设置斜率，可使机器动作连贯柔和，但机器响应会有所变慢。</p>
<p><br />
2. 座台慢速调试压力、流量：调模状态下，做座台进退动作输出的压力、流量。</p>
<p><br />
  二、调模：<br />
  1. 关模自调模低压计时：自动调模时，首次压模的持续时间 。</p>
<p><br />
  2. 位置调模比：Code0加上8，表示一个电眼计数为0.01mm，一般设置 的参数为5，表示一个电眼计数为0.05mm。</p>
<p><br />
  3. 最小模厚：即调模进终止时，动模板和静模板之间的距离。</p>
<p><br />
  4. 最大模厚：即调模退终止时，动模板和静模板之间的距离。</p>
</body>
