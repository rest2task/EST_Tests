<body style="width:650px;">
    <h2 class="警报标题">警报名称：校准行程异常(100206)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">机器的行程设定与机器的实际行程不匹配。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.请检查机器配置页面中该校准动作的电子尺行程与机械行程是否与当前机器实际行程相匹配。<br />2.检查在动作时，是否存在卡阀或者机械卡住的问题，从而导致动作几乎不会动，从而引起该警报。<br />3.检查该动作由哪一个驱动工作是否正常，或者是否该动作是否有特殊的阀需要打开才能正常运行。</p>
<br />

</body>
