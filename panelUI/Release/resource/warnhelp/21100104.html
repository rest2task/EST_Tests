<p class="文本">托模进的位置保护</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.当托模进终止位置大于开模终止位置时，做托模动作则出该警报。请设置合理的开模终止位置和托模进终止位置。</p>
