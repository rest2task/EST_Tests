    <h2 class="警报标题">警报名称：开关模电子尺数据跳变(20100202)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">检测到开合模电子尺存在异常数据。<br />1、电子尺的信号线、10V电源线或者GND线出现偶尔断线情况。<br />2、电子尺上有较为明显的坏点。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.更换或者清洗电子尺。<br />2.查看电子尺部分接线与接地是否正常。</p>
<br />
