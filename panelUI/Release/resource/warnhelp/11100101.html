    <h2 class="警报标题">警报名称：座进终未到位(11100101)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">自动下，使用系统比例储能，在射出前检查座进到位；</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.检查座进终行程开关安装位置是否超前。<br />2.查看I/O界面“座进终”输入是否正常，座进终行程开关是否损坏。</p>
