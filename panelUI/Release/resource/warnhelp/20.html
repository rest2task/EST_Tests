<body>
<p>窗口名：托模吹气设定</p>
<p>1.延时：表示自开模动作开始后多久才托模/吹气。即延时计时到达，托模/吹气动作开始。托模/吹气长短由动作时间栏控制。</p>
<p> <br />
  2.吹气设定：</p>
 2.1吹气方式4种：开模时间、位置，射出时间、位置；
<p align="left"> 2.2动作时间：即吹气阀输出时间；                  </p>
<p align="left">2.3延时：当吹气方式选择为开模、射出时间，开模、射出后，经过延时后输出吹气；                     </p>
<p align="left">2.4动作位置：当吹气方式选择为开模、射出位置，到达此设定位置才开始输出吹气。</p>
<!--<p><br />
  3.首次独立行程：托模定次时，首次托模进采用独立行程控制，行程在“首次位置”设置；</p>
<p><br />
  4.吹气按键选择：选择相应的吹气组，则按下面板上的吹气按键会对相应的吹气组进行操作。 </p>-->
