<body>
<p>窗口名：开关模功能</p>
<p>1.再循环计时：产品顶出后与下一模开始之间的间隔时间；</p>
<p><br />
  2.模具冷却时间：开模前开始计时，计时完成后开模；</p>
<p><br />
  3.差动合模：选为使用时，在进入关模低压前，输出差动阀；</p>
<p><br />
  4.开模联动：与开模动作一起进行，可选中子、托模 : Code1需加上2000；联动位置须大于低压模保位置；单油路联动，开模压力流量优先输出，开模完成后切换到中子或托模的压力流量。</p>
</body>
