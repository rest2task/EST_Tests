<p><span class="STYLE2">警报名：温度偏差</span></p>
<p><br />
  警报说明：<br />
1.做储料、射出、清料、储料加压、射退动作时，检测到料管某一段或多段实际温度超出警报偏差范围。</p>
<p><br />
  排除方法：<br />
  1.请开启马达，首先确认保险丝正常；</p>
<p><br />
  2.等待料管加热至设定温度；</p>
<p><br />
  3.如果长时间温度未上升，查看面板IO界面“电热(1-6)”输出点是否正常；</p>
<p><br />
  提示：进入电热输出界面，光标移到相应输出点，按输入键强制输出，观察万用表电压档有无输出（DC24V或AC220V) ；</p>
<p>4.查看加热圈、加热线是否断线。</p>
</body>
