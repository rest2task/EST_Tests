    <h2 class="警报标题">警报名称：机械手紧急停止(31100102)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">机械手选择欧规时，机械手急停按钮接常闭，“机械手急停”输入点被触发。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.查看面板I/O界面机械手急停是否输入正常，机械手急停按键是否被按下。</p>
