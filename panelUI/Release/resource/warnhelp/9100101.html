    <h2 class="警报标题">警报名称：压力传感器无效(9100101)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">压力传感器无效警报(压力传感器为1-5V)。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.确认压力传感器输出电压1-5V；<br />2.机器没有工作的状态下，查看压力传感器反馈电压应＞5/7≈0. 71V；<br />提示：如下图量测压力传感器信号对地电压，应在1V左右。<br />3.查看传感器插头，连接线，更换压力传感器。</p>
<br />
