    <h2 class="警报标题">警报名称：RS232通讯异常(331100)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">上位机与下位机的RS232通讯异常。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.检查接线和RS232通讯线是否正常；<br />2.检查上下位机是否已正常开机。</p>
