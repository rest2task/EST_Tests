    <h2 class="警报标题">警报名称：未检测到定位进退终(28100101)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">转盘进或者转盘退时，定位退终信号异常；</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.检查定位退终信号；<br />2.查看I/O界面“定位退终”输入是否正常，定位退终行程开关是否损坏。</p>
<br />
