<body>
<p>窗口名：IO重定义</p>
<p>1.重定义操作：输入、输出点编号必须从首行开始依次往下使用，前面有空行则后面定义无效。输入完毕需保存后才生效。</p>
<p><br />
2.输入、输出点编号：对电脑主机板上的输入、输出点编号。 </p>
<p><br />
  3.输入、输出点定义：只有输入、输出点编号更改后，同一行的定义才会显示，并可下拉选择需要的功能，按左右方向键可以快速翻页。 </p>
</body>
