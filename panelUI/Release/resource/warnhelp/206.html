<body>
<p>窗口名：机器系统参数一</p>
<p>1.马达保护计时：马达在Y转△启动完成后，保护持续时间，即在这个持续时间内不允许电机动作。</p>
<p><br />
  2.马达启动计时：马达Y启动的持续时间。</p>
<p><br />
  3.马达需要时间：马达Y转△的，中间转换所需时间。</p>
<p><br />
  4.马达警报计时：输入点“马达启动完成”未输入，在启动时间超过马达警报计时，报警“马达启动失败”。</p>
<!--<p><br />
  5.射出储能压力、流量：在有储能器的时候，射出储能过程中输出的压力.流量。</p>
<p><br />
  6.流量比例开1～7：在普通机系统每个比例阀开启的条件，某个动作的速度设定值&gt;=该阀设定值，此比例阀才打开。</p>-->
<p><br />
  5.小动作压力上限：座台、托模和中子动作的压力上限。 </p>
</body>
