<body style="width:650px;">
    <h2 class="警报标题">警报名称：压力传感器未归零(9100102)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">马达启动时检测到压力传感器反馈压力值小于-2Bar，或大于5Bar的范围。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.系统存在残压，不要开马达，按座退动作，开启动作阀，将系统残压泄掉；<br />2.在确认实际压力为零时，进入电子尺调整页面将传感器归零。</p>
<br />

</body>
