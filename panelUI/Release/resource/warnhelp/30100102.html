    <h2 class="警报标题">警报名称：润滑压力未到(30100102)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">润滑模式选择1或2时，在设定时间内压力开关无效。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.进入面板I/O界面，查看“润滑”输出和“润滑检知”输入工作情况，压力检知开关是否损坏；<br />2.查看润滑油位，润滑电机，管路是否异常。</p>
