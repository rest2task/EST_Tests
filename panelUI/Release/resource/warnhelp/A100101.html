    <h2 class="警报标题">警报名称：伺服故障(A100101)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">输入点伺服异常收到信号。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.检查外部驱动器是否警报；<br />2.查看I/O界面“伺服异常”输入是否正常，伺服异常行程开关是否损坏。</p>
