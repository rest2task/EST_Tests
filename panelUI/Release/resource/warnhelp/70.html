<body>
<p>窗口名：其它</p>
<p>1.粗调模模式：可选择“长动、点动、点动加长动”。</p>
<p>“长动”是指按着调模进、退键就一直输出，松开按键马上停止输出。</p>
<p>“点动”模式时 ，若“调模微调计时”不为0，则这个时间一到就停止输出；若为0时那么“调模微调步数”到就停止输出 。</p>
<p>“点动加长动”是先按点动模式调模，当点动结束后按键未松开就按长动模式继续输出。</p>
<p><br />
  2.任何一种调模模式在调模输出时，4秒钟未检测到调模电眼信号有变化，则警报“调模电眼失败”。</p>
<p><br />
  3.调模微调计时：点动模式，调模输出时间。</p>
<p><br />
  4.调模微调步数：点动模式，且调模微计时为0，调模电眼脉冲数到达调模微调步数,就停止输出。 </p>
</body>
