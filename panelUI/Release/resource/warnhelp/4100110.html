<body style="width:650px;">
    <h2 class="警报标题">警报名称：从站断线(4100110)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">在正常通讯过程时，主机与驱动器或者驱动器与驱动器的网线出现断开。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.确认主机到驱动器的网线是否正常连接。<br />2.确认驱动器与驱动器之间的网线是否正常连接。</p>
<br />
