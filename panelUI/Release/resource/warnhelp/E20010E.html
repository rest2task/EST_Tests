    <h2 class="警报标题">警报名称：TC2 温度异常(E20010E)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">料管温度中，有部分温度段出现"断线"、"反接"、"读失败"等状态。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">按照各段的相关状态对对应的温度段的接线进行检查。<br />1、断线：热电偶接线回路断开<br />2、反接：热电偶正负接反<br />3、读失败：温度读取失败，此问题如果长时间出现，请联系厂家</p>
<br />
