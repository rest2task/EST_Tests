    <h2 class="警报标题">警报名称：SDO读数据失败(D100103)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">读取驱动器数据时，未收到驱动器回复。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1、重新上电后再操作。<br />2、如果经常报此警报，请联系厂家。</p>
<br />
