    <h2 class="警报标题">警报名称：系统压力＞5公斤，无法转为从机(910010B)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">第2号开始的驱动器主机，切换成从机时，需要主机的系统压力降低至5公斤以下，才允许却换成从机。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.等压力降低至5公斤以下。</p>
