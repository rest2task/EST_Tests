    <h2 class="警报标题">警报名称：QC监控模数计数已到(10010D)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">QC监控使用时，当前开模数已达到设定的监控模数。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.根据需要打开或关闭QC监控功能；<br />2.设定合理的监控模数；<br />3.确认OK后，按手动清除警报。</p>
