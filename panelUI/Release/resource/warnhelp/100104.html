    <h2 class="警报标题">警报名称：内存不足(100104)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">部件申请空间过多，导致内存不足。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.调整动作的部件，部件数（如减少中子或者吹气个数），该警报由于动作太多所引起。<br />2.联系厂家解决。</p>
