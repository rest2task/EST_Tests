    <h2 class="警报标题">警报名称：TC2 温度没有上升(E200102)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">使用电热连续加温检查功能，首次加热过程，200秒内某一段温度没有上升。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">排除方法;<br />1.查看面板I/O界面“电热(1-8)”输出是否正常，外围接线是否可靠；<br />提示：查看方法请参考page2。<br />2.查看料管加热线圈供电是否正常；<br />3.查看加热圈、加热线是否断线。</p>
<br />
