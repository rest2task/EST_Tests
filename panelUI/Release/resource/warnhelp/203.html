<p>窗口名：泵浦配置</p>
<p>1.选中左下方泵浦调整才能进行泵浦配置。</p>
<p><br />
  2.配置方法：选中“泵浦调整”，设定每个动作的泵浦配置。对应的小方框输入1，表示进行该动作时此泵输出。每次改变泵浦必须按手动键确认。 </p>
