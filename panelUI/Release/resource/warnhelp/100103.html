<body style="width:650px;">
    <h2 class="警报标题">警报名称：全程未定时完成(100103)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">自动运行选择时间自动，全程计时超过警报计时上限。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.查看警报画面中的“生产自动警报”中的数据，同时查看机器中造成延时的动作；将对应的动作的警报上限值适当延长，同时将全程计时上限也可以适当延长。<br />2.重新开关自动警报功能，让电脑重新计算每个动作的警报时间。<br />3.排除引机械故障造成的动作延时。</p>
<br />

</body>
