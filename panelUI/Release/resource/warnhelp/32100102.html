    <h2 class="警报标题">警报名称：电眼检测物料已满(32100102)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">电眼自动时，开模时或关模时检出电眼一直有信号；</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.检查实际物料是否满了，满了则及时处理；<br />2.查看I/O界面“检出电眼”输入是否正常，检出电眼行程开关是否损坏。</p>
<br />
