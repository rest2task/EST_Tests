    <h2 class="警报标题">警报名称：后安全门未关(29100103)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">注塑机背安全门未关好。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.请关好后安全门；<br />2.查看I/O界面“后安全门关终”输入是否正常，后安全门关终行程开关是否损坏。<br />查看方法提示：如下图将原接线路脱开，用一根导线将对应的输入点端口与HCOM相连，再断开，查看对应编号指示是否变化。</p>
