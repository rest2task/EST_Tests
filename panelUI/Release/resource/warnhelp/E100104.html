<body style="width:650px;">
    <h2 class="警报标题">警报名称：TC1 加热接触器异常(E100104)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">开电热时，加热接触器无信号；</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.检查加热接触器是否给出正确信号；<br />2.查看I/O界面“加热接触器”输入是否正常，加热接触器行程开关是否损坏。</p>
<br />
