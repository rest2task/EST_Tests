<body style="width:650px;">
    <h2 class="警报标题">警报名称：射出监控异常(10100101)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">射出终止位置超出“射出监控”允许偏差范围。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.查看是否有缺料、溢料。<br />2.查看射嘴是否阻塞。<br />3.查看生产自动警报“射出监控”位置是否过小，请适当调整。<br />4.是否在机器已经开启自动警报的情况下，对射出相应的参数做了比较大的改变，如果是请重新开关自动警报，让电脑重新计算。<br />5.若射出动作没有采用电子尺的，请查看面板I/O界面“射出三段”输入是否正常，射出三段监测开关是否损坏。</p>
<br />

</body>
