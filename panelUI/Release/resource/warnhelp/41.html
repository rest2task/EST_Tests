<body>
<p>窗口名：储料射退功能</p>
<p>1.储前冷却时间：保压结束到下次开始储料的冷却间隔时间。</p>
<p><br />
  2. 储料开模功能：Code1加上100，此参数开放，输入1，储料同时开模，输入0不使用此功能。</p>
<p><br />
  3.储料快速功能：如输出点有“储料快速”，这里选为使用，该点在储料时才输出。</p>
<p><br />
  4.再次储料计时：射出前按该设定时间做储料动作。</p>
<p><br />
  5.清料时间：设定进行自动清料时储料动作的时间。</p>
<p><br />
  6.清料次数：设定自动清料动作的循环次数，该次数到，出现“自动清料完成”。 </p>
<p>&nbsp;</p>
</body>
</html>
