    <h2 class="警报标题">警报名称：落料电眼检出异常(32100101)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">检出电眼未感应到成品脱落。<br />注：检测时间段在，托模，及再循环时间内。若过在这两个时间内还未检测到电眼。将再延迟电眼检测计时来检测。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.检查产品是否在检测时间内落下，如果已经超出了检测时间，则可以适当增大电眼检测计时。<br />2.查看产品是否正常经过电眼区域，并被电眼检测到。<br />3.查看面板I/O界面检出电眼输入是否有效，检出电眼是否损坏。<br />查看方法提示：如下图将原接线路脱开，用一根导线将对应的输入点端口与HCOM相连，再断开，查看对应编号指示是否变化。</p>
<br />
