<body>
<p>窗口名：温度参数二</p>
<p>1.油温高开冷却：<br />
（油箱实际温度≥油温上限-油温高开冷却值时，开启油箱温度冷却器）</p>
<p><br />
  2.油温低关冷却：<br />
  （油箱实际温度≤油温下限-油温低关冷却值时，关闭油箱温度冷却器）</p>
<p><br />
  3.料管冷却开偏差值：料管温度高于（设定温度+此值），冷却风扇开。</p>
<p><br />
  4.料管冷却关偏差值：料管温度低于（设定温度-此值），冷却风扇关。</p>
<p><br />
  5.电热连续加温不检查：如设定值为0，加热过程中检测到料筒某段的温度在200秒内没有变化，即警报“温度没有上升”；设定值为1，不作检查。</p>
</body>
