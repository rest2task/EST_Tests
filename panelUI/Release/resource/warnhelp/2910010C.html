    <h2 class="警报标题">警报名称：安全阀异常(2910010C)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">1.安全门打开后，"安全阀检测输入点"有信号持续时间超过"安全阀延迟检测时间"；<br />2.在做关模动作时，延时"安全阀延迟检测时间"后，输入点“安全阀检测”输入点任然没信号。<br />3.在非开模动作时，打开安全门，5秒后无"安全阀检测"输入点信号输入。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.查看I/O界面“安全阀检测”输入是否正常，安全阀检测行程开关是否损坏；</p>
