<style type="text/css">
.警报标题 {
 color: #900;
 font-size: 18px;
    font-weight: bold;
}
.标题 {
    font-size: 18px;

}
.文本 {
    font-size: 18px;

 color:rgb(0,111,55);
 word-spacing: normal;
}
</style>

<body style="width:650px;">
    <h2 class="警报标题">警报名称：托模方式错误(21100103)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">停留模式，进行非半自动动作。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.如果要使用停留功能，须将自动模式改为半自动模式。<br />2.如无特殊需求，托模不使用停留模式。</p>
<br />

</body>
