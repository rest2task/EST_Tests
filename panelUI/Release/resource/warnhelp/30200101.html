    <h2 class="警报标题">警报名称：润滑2 油位低(30200101)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">润滑油油量不足或润滑油油位检知开关故障。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.请添加润滑油；<br />2.查看面板I/O界面“润滑油位检知”输入是否正常，润滑油位检知开关是否损坏。</p>
<br />
