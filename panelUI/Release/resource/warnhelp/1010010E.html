    <h2 class="警报标题">警报名称：储料位置已到(1010010E)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">DA校正输出储料动作时，储料已到达设定终点位置。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.查询电子尺是否装反，正确应为螺杆进到底为最小值，螺杆退到底为最大值。<br />2.设置合理的终点位置。<br />3.把螺杆进到靠近底部，注意不可太底部，有些特殊机器不允许在射出到底时进行储料动作。</p>
<br />

</body>
