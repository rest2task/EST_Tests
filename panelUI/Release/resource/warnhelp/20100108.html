    <h2 class="警报标题">警报名称：开模1慢未到定位(20100108)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">自动调模首次压模时，关模时间超过“自调模低压计时”。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.查看关模到底曲臂伸直时，模座电子尺是否处于零位，如果不是请归零。<br />提示：确认开关模电子尺实际值+10 ＜ 开模一段终止位置。<br />2.延长自调模低压计时。</p>
<br />
