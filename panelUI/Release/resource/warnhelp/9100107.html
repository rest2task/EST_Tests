<body style="width:650px;">
    <h2 class="警报标题">警报名称：转速波动过大(9100107)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">伺服比例泄压阀整定时，实际电机转速波动超过“转速波动最大值”。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.查看设置的波动范围是否过小；<br />2.查看转矩上限是否设置过小。</p>
<br />
