    <h2 class="警报标题">警报名称：等待机械手(31100103)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">1.机械手选择常规：<br />a).关模前，“机械手”输入点未被触发。<br />2.机械手选择欧规：<br />a).关模前，“关模安全”输入点未被触发。<br />3.机械手选择欧规且“机械手手动”输入点未被触发：<br />a).中子进前，“中子进安全”输入点未被触发；<br />b).中子退前，“中子退安全”输入点未被触发；<br />c).托模进前，“顶进安全”输入点未被触发；<br />d).托模退前，“顶退指令”输入点未被触发；<br />e).半自动、时间(或电眼)自动再循环开始前，“循环启动”输入点未被触发。</p>
