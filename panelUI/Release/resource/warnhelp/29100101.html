    <h2 class="警报标题">警报名称：安全门未关(29100101)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">安全门处于打开的状态。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1. 关上安全门，在面板上按主画面→换页→F6→进入IO输入界面，查看“安全门关”和“安全门关#2”输入是有效；<br />2. 若输入无效请按以下方法排查：<br />查看方法提示：如下图将原接线路脱开，用一根导线将对应的输入点端口与HCOM相连，再断开，查看对应编号指示是否变化。</p>
