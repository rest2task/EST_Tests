    <h2 class="警报标题">警报名称：调模电眼异常(24100103)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">调模时电眼在4秒内无信号跳变，或调模齿未动。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.自动调模时报警，将开模一段位置设大点；<br />2.增大调模压力速度；<br />3.查看调模机械结构是否卡住了；<br />4.确认调模电眼接线无异常，电眼有效果。</p>
<br />
