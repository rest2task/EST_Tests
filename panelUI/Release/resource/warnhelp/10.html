<body>
<p>窗口名：开关模</p>
<p><br />
  1.关模到底电子尺显示最小值，开模到底则显示最大；</p>
<p><br />
  2.终止位置的输入受相邻段位置限制，所以要按以下顺序设定：关模从关模一段依次往下设定，开模从开模终止依次向上设定；</p>
<p><br />
  3.开关模终止位置设定：每一段设定的终止位置到达前，按该段压力、流量输出。</p>
<p><br />
  4.关模三段和开模四段：进入F2功能中选择。</p>
</body>
