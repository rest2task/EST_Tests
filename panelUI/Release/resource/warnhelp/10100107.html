<body style="width:650px;">
    <h2 class="警报标题">警报名称：射退终未到定位(10100107)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">射退动作未达到射退终止位置，超出警报计时上限。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.调整射退终止位置。<br />提示：查看当前电子尺位置，应大于等于射退终止位置设定值。<br />2.查看料嘴是否堵塞、料筒塑料是否正常。<br />3.如果执行手动射退，进入“警报”-“F3参数”修改“射退计时上限”。<br />说明：“自动警报启动模数”选择“0”，不使用“生产自动警报”中的参数。<br />4.如果自动运行时警报，可进入“警报”-“F2警报”修改“射退计时”。</p>
<br />

</body>
