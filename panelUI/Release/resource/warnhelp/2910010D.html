    <h2 class="警报标题">警报名称：安全阀先导阀异常(2910010D)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">安全门打开0.5s后，输入点“安全阀先导阀检测”没信号。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.确认安全阀正常给出信号；<br />2.查看I/O界面“安全阀先导阀检测”输入是否正常，安全阀先导阀检测行程开关是否损坏；</p>
