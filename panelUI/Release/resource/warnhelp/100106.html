    <h2 class="警报标题">警报名称：动作插入失败(100106)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">任务无空闲的，动作无法插入，警报动作插入失败；</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.调整插入任务的位置，或取消部分无用任务。<br />2.联系厂家解决。</p>
