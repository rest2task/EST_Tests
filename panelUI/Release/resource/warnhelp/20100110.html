<body style="width:650px;">
    <h2 class="警报标题">警报名称：合模锁死保护失败(20100110)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">手动下锁模完成后，超出保护时间则进行锁死保护警报。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.设置合理的合模锁死保护时间。<br />2.查看是否锁死，若未锁死，则检查关模终信号，若 锁死，则做开模动作打开一些，让关模终信号不要压到。<br />3.查看I/O界面“关模终”输入是否正常，关模终行程开关是否损坏。</p>
<br />

</body>
