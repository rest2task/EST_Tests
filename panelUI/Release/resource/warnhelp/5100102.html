<p><span class="STYLE1">警报名：温度没有上升</span></p>
<p><br />
  警报说明：<br />
1.使用电热连续加温检查功能，首次加热过程，200秒内某一段温度没有上升。</p>
<p><br />
  排除方法;<br />
  1.查看面板IO界面“电热(1-6)”输出是否正常，外围接线是否可靠；<br />
  ?提示：查看方法请参考page2。</p>
<p><br />
  2.查看料管加热线圈供电是否正常；</p>
<p><br />
  3.查看加热圈、加热线是否断线。 </p>
