    <h2 class="警报标题">警报名称：漏油(C100104)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">在电机有转速的工况下，实际系统压力小于最小系统压力值且持续时间超过检测时间。</p>
<br />
<p class="标题">排除方法</p>
