<p>窗口名：托模参数</p>
<p>1.压力、流量斜率：压力、流量加减速时间，单位（S）；</p>
<p><br />
  2.托模调试：调模状态时托模动作压力、流量输出；</p>
<p><br />
  3.托模退位置有效区：托模退终位置在此偏差范围内方允许关模；</p>
<p><br />
  4.托模退位置允许最大值：即“托退二段”终止位置允许设定最大值； </p>
