    <h2 class="警报标题">警报名称：电机温度过高(4100104)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">检测到电机温度超过“电机温度上限”。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.查看电机风扇是否正常工作；<br />2.查看电机温度检测热电偶是否正常。</p>
