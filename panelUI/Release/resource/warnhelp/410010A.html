<title>从站个数不匹配</title>

<style type="text/css">
.警报标题 {
 color: #900;
 font-size: 18px;
    font-weight: bold;
}
.标题 {
    font-size: 18px;
    font-weight: bold;
}
.文本 {
    font-size: 18px;
}
.backcolor {
 color:rgb(0,111,55);
 word-spacing: normal;
}
</style>
</head>
<body style="width:650px;">
    <h2 class="警报标题">警报名称：从站个数不匹配(410010A)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">主机配置的驱动个数与主机实际连接的驱动器个数不匹配。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.确认驱动个数是否与配置的相同。<br />2.确认驱动器型号是否正确。(比如650N与ES810驱动器时不匹配的，也会出现该警报)</p>
<br />

</body>
</html>
