<title>主机与驱动器模式不匹配</title>

<style type="text/css">
.警报标题 {
 color: #900;
 font-size: 18px;
    font-weight: bold;
}
.标题 {
    font-size: 18px;
    font-weight: bold;

 color:rgb(0,111,55);
 word-spacing: normal;
}
</style>

<body>
    <h2 class="警报标题">警报名称：主机与驱动器模式不匹配(A010102)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">主机选择的伺服模式与驱动器设置的伺服模式不匹配。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.重新设置主机或者驱动器的模式，使两者工作在同一模式。</p>
<br />

</body>
