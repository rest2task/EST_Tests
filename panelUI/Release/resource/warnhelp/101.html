<body>
<p>窗口名：生产自动警报</p>
<p>1.自动警报：需要选择，当F3警报参数里的“自动警报启动模数”到了后，自动开启。</p>
<p><br />
  2.射出监控：例如设置是+a 、b-，则a、b 表示自动监控允许射出位置偏差值范围。当射出完成时，射出位置与设定位置的差值超出此范围，会警报“射出监控失败“。所以该范围越小，产品良品率越高，但太小容易警报，所以应合理设置此参数。</p>
<p><br />
  3.每一个警报计时上限，在启动自动警报时会自动统计生成，不需要人工输入。 </p>
</body>
</html>
