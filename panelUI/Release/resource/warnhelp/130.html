<p>窗口名：输入点一</p>
<p>1.输入点的功能和状态：</p>
<p> 1.1 每一个输入点编号的右边表示该点功能，左边的圆圈表示该点输入状态，变绿灯时为输入有效。</p>
<p><br />
  1.2 若某个点输入硬件损坏，可通过 “IO重定义”可用一个空余的点将坏的点替换掉（注意下位机相应接线的调整）。</p>
<p><br />
