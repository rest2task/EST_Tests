    <h2 class="警报标题">警报名称：机械手异常-ROB允许中子A进(22100105)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">机械手动作中，IO点“允许中子进”没有信号</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.在中子进过程中，“允许中子进”，“中子2进允许”不允许没信号，必须持续有信号</p>
