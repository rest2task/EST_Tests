    <h2 class="警报标题">警报名称：自动门安全异常(2910010A)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">1.自动安全门关闭过程中，“安全门防碰”输入点被触发；<br />2.自动安全门关闭过程中，“底板安全”输入点被触发；</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.进入面板I/O界面查看“安全门防碰”“底板安全”输入点，查看安全门防碰感应开关(红外线门帘)是否损坏；<br />2.查看主机“安全门防碰”“底板安全”输入点或输入信号是否异常。</p>
<br />
