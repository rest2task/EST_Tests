<body>
<p><span class="STYLE1">警报名：外部室温异常</span></p>
<p><br />
  警报说明：<br />
1. 外部室温传感器检测到的数据超出设定范围（0~100摄氏度温差）。</p>
<p><br />
  排除方法：<br />
  1、短接最后一路温度，查看警报是否消除。如果未消除，请联系售后。</p>
<p><br />
  2、检查外部室温传感器接线，查看是否出现断开、反接等现象。 </p>
</body>
