    <h2 class="警报标题">警报名称：关模保护失败(20100103)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">1.关模低压动作的时间超过关模低压计时警报上限，或者高压锁模动作时间超过关模高压计时警报上限。<br />2.特殊厂家时，有判断“关模备用”这个输入点，无信号时则报警。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.查看模腔内是否有异物。<br />2.调整关模低压的压力、流量参数。<br />3.调整警报参数画面中对应的低压和高压的警报时间。</p>
<br />
