<p>窗口名：中子功能</p>
<p>1.中子保护功能：选择为使用时。</p>
<p> 1.1 关模前将检测中子是否到位；</p>
<p> 1.2 手动时，假定中子动作位置为A，开模有效位置为B，0&lt;A-B&lt; 允许手动操作的中子动作区 &lt; A+B，其他位置不能做中子动作。</p>
<p><br />
  2.途中中子位置有效区：途中中子动作的有效范围。</p>
<!--<p><br />
  3.中子A按键选择：可选择为A或D,如选择了中子D,按下中子一,就是做中子D动作</p>
<p><br />
  4.中子B按键选择：可选择为B或E,如选择了中子E,按下中子二,就是做中子E动作</p>
<p><br />
  5.中子C按键选择：可选择为C或F，如选择了中子F,按下中子三,就是做中子F动作</p>-->
<p><br />
  3.特殊中子功能选择：有6种模式，选中其中一种模式时，页面下方会显示该模式的动作过程。 </p>
