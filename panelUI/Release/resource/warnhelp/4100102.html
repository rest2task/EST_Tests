    <h2 class="警报标题">警报名称：马达过载(4100102)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">马达过载。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.请确认外部马达热继电器是否正常；电机三相是否有过流；<br />2.查看I/O界面，“马达过载”输入信号或者输入点是否异常。<br />查看方法提示：如下图将原接线路脱开，用一根导线将对应的输入点端口与HCOM相连，再断开，查看对应编号指示是否变化。</p>
