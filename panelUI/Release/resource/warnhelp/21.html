<body>
<p>窗口名：托模吹气功能</p>
<p>1.电眼检出选择：选择使用时为电眼自动，当电眼检测不到产品掉落，则不能关模并警报；当电眼检测一直有输入则认为产品堆满并警报；</p>
<p><br />
2.半托时不切托进阀：选择为1且托模方式为停留时，才有此功能，保持托进时动作压力、流量为托模慢速调试压力、流量；</p>
<p><br />
  3.托模终检测时间：在关模过程中，超出此设定时间未检测到托模终信号，则报警。 </p>
</body>
