<body style="width:650px;">
    <h2 class="警报标题">警报名称：合模开关未同步(2910010F)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">立式机，进入启动时需要两个启动键同时按下，在2s内只收到其中一个按钮的信号。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.同时按下两个按钮；<br />2.检查按键板工作是否正常，按下时有声音正常。</p>
<br />

</body>
