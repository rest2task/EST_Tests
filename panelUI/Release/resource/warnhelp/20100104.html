    <h2 class="警报标题">警报名称：开模未到定位(20100104)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">1.开模过程，开模时间超过开模计时警报上限；<br />2.自动调模，开模终止位置超出有效区范围；<br />3.托模前检测到开模未到定位。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.排除造成开模动作延时的机械故障，重新设置“开模计时警报上限”。<br />2.查看面板IO界面“开模终”是否存在，如果有，则查看输入是否有效，“开模终”行程开关是否损坏；<br />查看方法提示：如下图将原接线路脱开，用一根导线将对应的输入点端口与HCOM相连，再断开，查看对应编号指示是否变化。</p>
<br />
