<body style="width:650px;">
    <h2 class="警报标题">警报名称：TC2 料管温度偏差(E200105)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">1.料管温度中有一段温度的实际值＞(该段温度设定值+上偏差)<br />2.料管温度中有一段温度的实际值＜(该段温度设定值+下偏差)</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">观察温度是否与说明描述的相一致。<br />1.如果出现此类现象，可以适当调整上下偏差值。<br />2.等温度稳定后再进行动作。<br />3.结合实际情况调整温度设定值或者PID值，来使温度控制达到稳定。</p>
<br />
