 color: #900;
 font-size: 18px;
    font-weight: bold;
}

<body style="width:650px;">
    <h2 class="警报标题">警报名称：料筒温度偏差(1010010C)</h2>
<br />
<p class="标题">警报说明</p>
<p class="文本">料筒实际温度大于（设定值+上偏差）或者小于（设定值-下偏差）。</p>
<br />
<p class="标题">排除方法</p>
<p class="文本">1.等待实际温度加热至偏差范围内。<br />2.调整上偏差或下偏差在合理值内。</p>
<br />

</body>
